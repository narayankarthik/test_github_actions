name: Events Demo
# on: [push, workgroup_dispatch]
on: 
    # push:
    #     branches:
    #         - main
    workflow_dispatch:
    # push:
    #     branches:
    #         - main
    #         - 'dev-*'
    #         - 'feature/**'
    #     paths:
    #         - '.github/workflows/**'
    # pull_request:
    #     types:
    #         - opened
    #     branches:
    #         - main 

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Cache dependencies
              uses: actions/cache@v6
              with: 
                path: '~/.npm'
                key: dependency-keyhash-${{ hashFiles('**/package.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Test code
              run: npm run test

    build:
        needs: test
        runs-on: ubuntu-latest
        outputs:
            script-file: ${{ steps.publish.outputs.script-file }}
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Cache dependencies
              uses: actions/cache@v6
              with: 
                path: '~/.npm'
                key: dependency-keyhash-${{ hashFiles('**/package.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Build code
              run: npm run build
            - name: Publish JS filename
              id: publish
              run: find dist/assets/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'
            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                name: dist-files
                path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v7
              with:
                name: dist-files
            - name: List File
              run: ls
            - name: Print file name
              run: echo "${{ needs.build.outputs.script-file }}"
            - name: Deploy code
              run: echo "Deployed."