name: Events Demo
# on: [push, workgroup_dispatch]
on: 
    push:
        branches:
            - main
            - 'dev-*'
            - 'feature/**'
        paths:
            - '.github/workflows/**'
    pull_request:
        types:
            - opened
        branches:
            - main   
    workflow_dispatch:
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Test code
              run: npm run test
            - name: Build code
              run: npm run build
            - name: Deploy code
              run: echo "Deployed."