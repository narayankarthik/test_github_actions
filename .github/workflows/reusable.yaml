name: Reusable deploy
on: 
    workflow_call:
        inputs:
            artifact-id:
                description: artifact-id
                required: false
                default: dist
                type: string
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get artifact
              uses: actions/download-artifact@v7
              with:
                name: ${{ inputs.artifact-id }}
            - name: List files
              run: ls
            - name: Output information
              run: echo "Deploying and Uploading.."