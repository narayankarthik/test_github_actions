name: Deployment job
on: [workflow_dispatch, push]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run test
              run: npm test
    
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Create build
              run: npm run build
            - name: Deploy build
              run: echo "Deployed Build"